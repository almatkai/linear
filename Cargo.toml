[package]
name = "tezbar-linear"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
publish = false

[features]
fixture = []

[dependencies]
tezbar-extension-sdk = { git = "https://github.com/almatkai/tezbar-extension-sdk-rust.git", rev = "1a11afc14693cc6463e0b95ae7d61991b4a60427", version = "=0.1.1" }
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "=0.3.44", features = ["formatting", "parsing"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[profile.release]
strip = true
